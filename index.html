<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>INDIGINEER</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
background:#0f0f0f;
color:white;
font-family:Poppins;
padding:30px;
}

h1{
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.card{
background:#1a1a1a;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.info{
padding:10px;
}

.search{
padding:10px;
width:250px;
margin-bottom:20px;
}

button{
padding:10px 15px;
margin:10px;
cursor:pointer;
}

</style>
</head>

<body>

<h1>🔥 Top Anime</h1>

<div class="grid" id="topAnime"></div>

<h1>📚 All Anime</h1>

<input class="search" id="search" placeholder="Search anime...">

<div class="grid" id="animeList"></div>

<button onclick="prevPage()">Prev</button>
<button onclick="nextPage()">Next</button>

<script>

let page = 1
let animeData = []

async function loadTopAnime(){

const res = await fetch("https://api.jikan.moe/v4/top/anime?limit=12")

const data = await res.json()

displayAnime(data.data,"topAnime")

}

async function loadAnime(){

const res = await fetch(`https://api.jikan.moe/v4/anime?page=${page}`)

const data = await res.json()

animeData = data.data

displayAnime(animeData,"animeList")

}

function displayAnime(list,id){

const container = document.getElementById(id)

container.innerHTML=""

list.forEach(anime=>{

const card = document.createElement("div")

card.className="card"

card.onclick=()=>{

window.location="details.html?id="+anime.mal_id

}

card.innerHTML=`

<img src="${anime.images.jpg.image_url}">

<div class="info">

<h4>${anime.title}</h4>

<p>⭐ ${anime.score || "N/A"}</p>

</div>

`

container.appendChild(card)

})

}

function nextPage(){

page++

loadAnime()

}

function prevPage(){

if(page>1){

page--

loadAnime()

}

}

document.getElementById("search").addEventListener("input",(e)=>{

const value = e.target.value.toLowerCase()

const filtered = animeData.filter(a =>

a.title.toLowerCase().includes(value)

)

displayAnime(filtered,"animeList")

})

loadTopAnime()
loadAnime()

</script>

</body>
</html>
