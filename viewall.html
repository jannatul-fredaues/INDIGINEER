<title>All Anime - INDIGINEER</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#0f0f0f;
color:white;
padding:40px;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.header h1{
font-size:32px;
}

.header a{
color:#ff4c4c;
text-decoration:none;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:25px;
}

/* CARD */

.card{
aspect-ratio:2/3;
border-radius:15px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* TITLE */

.card-info{
position:absolute;
bottom:0;
width:100%;
padding:12px;
background:linear-gradient(transparent,black);
}

.card-info h3{
font-size:14px;
}

</style>
</head>

</div>
